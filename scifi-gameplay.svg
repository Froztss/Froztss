<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Animated sci-fi gameplay preview: a starfighter blasts enemy drones across three lanes in deep space">
  <style>
    .ship   { animation: lanes 9s ease-in-out infinite; }
    .flame  { animation: flame 0.12s linear infinite; transform-box: fill-box; transform-origin: right center; }
    .lane   { opacity: 0; }
    .l0 { animation-delay: 0s; } .l1 { animation-delay: -6s; } .l2 { animation-delay: -3s; }
    .enemy  { animation: enemy 9s linear infinite; opacity: 0; }
    .boom   { animation: boom 9s linear infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fire   { animation: window 9s linear infinite; opacity: 0; }
    .shot   { animation: shot 0.3s linear infinite; }
    .far    { animation: drift 6s linear infinite; }
    .near   { animation: drift 2.4s linear infinite; }
    .planet { animation: planet 40s linear infinite; }
    .pulse  { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes lanes  { 0%,28% { transform: translateY(0); } 34%,61% { transform: translateY(80px); } 67%,94% { transform: translateY(160px); } 100% { transform: translateY(0); } }
    @keyframes flame  { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.55); } }
    @keyframes enemy  { 0% { transform: translateX(320px); opacity: 0; } 2% { opacity: 1; }
                        17%,25% { transform: translateX(0); opacity: 1; } 25.5%,100% { transform: translateX(0); opacity: 0; } }
    @keyframes boom   { 0%,25% { transform: scale(.2); opacity: 0; } 26% { transform: scale(.5); opacity: 1; }
                        32% { transform: scale(1.7); opacity: 0; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes window { 0%,17% { opacity: 0; } 18%,25% { opacity: 1; } 25.5%,100% { opacity: 0; } }
    @keyframes shot   { from { transform: translateX(0); } to { transform: translateX(380px); } }
    @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-800px); } }
    @keyframes planet { from { transform: translateX(0); } to { transform: translateX(-1100px); } }
    @keyframes pulse  { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070817"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <radialGradient id="world" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#6d4de0"/>
      <stop offset="1" stop-color="#1d1650"/>
    </radialGradient>
    <g id="drone">
      <polygon points="0,-18 22,0 0,18 -10,0" fill="#2a0f2e" stroke="#ff4f6e" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="2" cy="0" r="4.5" fill="#ffbb4d"/>
    </g>
  </defs>

  <rect width="800" height="300" fill="url(#space)"/>

  <!-- planet -->
  <g class="planet">
    <g transform="translate(980,150)">
      <circle r="110" fill="url(#world)"/>
      <ellipse rx="170" ry="26" fill="none" stroke="#3ee8c9" stroke-opacity=".45" stroke-width="3" transform="rotate(-18)"/>
    </g>
  </g>

  <!-- star layers -->
  <g class="far" fill="#8088b8">
    <g id="starsA">
      <rect x="40"  y="30"  width="2" height="2"/><rect x="150" y="220" width="2" height="2"/>
      <rect x="260" y="90"  width="2" height="2"/><rect x="380" y="260" width="2" height="2"/>
      <rect x="500" y="40"  width="2" height="2"/><rect x="610" y="180" width="2" height="2"/>
      <rect x="720" y="110" width="2" height="2"/><rect x="790" y="250" width="2" height="2"/>
    </g>
    <use href="#starsA" x="800"/>
  </g>
  <g class="near" fill="#dfe6ff">
    <g id="starsB">
      <rect x="90"  y="60"  width="12" height="2"/><rect x="230" y="180" width="16" height="2"/>
      <rect x="340" y="20"  width="10" height="2"/><rect x="450" y="130" width="18" height="2"/>
      <rect x="560" y="280" width="12" height="2"/><rect x="680" y="70"  width="16" height="2"/>
      <rect x="770" y="200" width="10" height="2"/>
    </g>
    <use href="#starsB" x="800"/>
  </g>

  <!-- lane guides -->
  <g stroke="#262b52" stroke-width="1" stroke-dasharray="3 9">
    <line x1="0" y1="70"  x2="800" y2="70"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="230" x2="800" y2="230"/>
  </g>

  <!-- lane actions: enemy, shots, explosion -->
  <g transform="translate(0,70)">
    <g class="lane l0">
      <g class="fire l0"><g fill="#3ee8c9"><rect class="shot" x="190" y="-1.5" width="22" height="3"/><rect class="shot" x="190" y="-1.5" width="22" height="3" style="animation-delay:-.1s"/><rect class="shot" x="190" y="-1.5" width="22" height="3" style="animation-delay:-.2s"/></g></g>
      <g class="enemy l0" style="opacity:0"><use href="#drone" x="640"/></g>
      <g class="boom l0"><circle cx="640" cy="0" r="30" fill="#ffbb4d"/><circle cx="640" cy="0" r="16" fill="#fff"/></g>
    </g>
  </g>
  <g transform="translate(0,150)">
    <g class="lane l1">
      <g class="fire l1"><g fill="#3ee8c9"><rect class="shot" x="190" y="-1.5" width="22" height="3"/><rect class="shot" x="190" y="-1.5" width="22" height="3" style="animation-delay:-.1s"/><rect class="shot" x="190" y="-1.5" width="22" height="3" style="animation-delay:-.2s"/></g></g>
      <g class="enemy l1"><use href="#drone" x="640"/></g>
      <g class="boom l1"><circle cx="640" cy="0" r="30" fill="#ffbb4d"/><circle cx="640" cy="0" r="16" fill="#fff"/></g>
    </g>
  </g>
  <g transform="translate(0,230)">
    <g class="lane l2">
      <g class="fire l2"><g fill="#3ee8c9"><rect class="shot" x="190" y="-1.5" width="22" height="3"/><rect class="shot" x="190" y="-1.5" width="22" height="3" style="animation-delay:-.1s"/><rect class="shot" x="190" y="-1.5" width="22" height="3" style="animation-delay:-.2s"/></g></g>
      <g class="enemy l2"><use href="#drone" x="640"/></g>
      <g class="boom l2"><circle cx="640" cy="0" r="30" fill="#ffbb4d"/><circle cx="640" cy="0" r="16" fill="#fff"/></g>
    </g>
  </g>

  <!-- player starfighter (base lane y=70) -->
  <g transform="translate(0,70)">
    <g class="ship">
      <polygon class="flame" points="116,0 78,-7 78,7" fill="#ffbb4d"/>
      <polygon points="180,0 124,-16 104,-30 112,-8 92,0 112,8 104,30 124,16" fill="#10132b" stroke="#3ee8c9" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="154,0 134,-5 134,5" fill="#3ee8c9"/>
    </g>
  </g>

  <!-- HUD -->
  <text x="24" y="34" font-family="monospace" font-size="18" font-weight="bold" fill="#dfe6ff">SCORE</text>
  <g font-family="monospace" font-size="18" font-weight="bold" fill="#ffbb4d">
    <text x="92" y="34" opacity="1">0000<animate attributeName="opacity" values="1;0" keyTimes="0;0.31" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="92" y="34" opacity="0">0100<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.31;0.64" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="92" y="34" opacity="0">0200<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.64;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
    <text x="92" y="34" opacity="0">0300<animate attributeName="opacity" values="0;1" keyTimes="0;0.97" calcMode="discrete" dur="9s" repeatCount="indefinite"/></text>
  </g>
  <text x="776" y="34" text-anchor="end" font-family="monospace" font-size="14" fill="#8088b8">SECTOR 07</text>
  <g fill="#3ee8c9">
    <rect x="684" y="46" width="16" height="6"/><rect x="706" y="46" width="16" height="6"/><rect x="728" y="46" width="16" height="6"/>
  </g>
  <text x="400" y="290" text-anchor="middle" font-family="monospace" font-size="13" fill="#8088b8" class="pulse">ORBITAL BREACH · hold the line, pilot</text>
</svg>
